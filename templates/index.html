<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ascii Art Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script>
        window.onload = function() {
            document.getElementById("text").focus();
        };

        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById("text").addEventListener("keypress", function(event) {
                if (event.key === "Enter") {
                    event.preventDefault();
                    document.getElementById("submit").click();
                }
            });
        });

        (function() {
            const text = document.getElementById('text');
            const clearBtn = document.getElementById('clear');

            clearBtn.addEventListener('click', () => {
                text.value = '';
                text.focus();
            });

            text.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                }
            });

            document.getElementById('generator').addEventListener('submit', function(event) {
                const selectedFont = document.querySelector('input[name="fonts"]:checked').value;
                console.log("Selected font:", selectedFont);  
            });
        })();
    </script>
</head>

<body>
    <div class="container">
        <header>
            <h1>Ascii Art Generator</h1>
            <p class="tagline">Turn your text into ASCII art. Choose a font and submit.</p>
        </header>

        {{if .Error}}
            <div class="error" role="alert">
                {{.Error}}
            </div>
        {{end}}

        <main>
            <div class="columns">
                <form method="POST" action="/asciiart" class="form" id="generator">
                    <label for="text">Enter text</label>
                    <textarea name="text" id="text" placeholder="ASCII characters only" aria-label="Input text" aria-describedby="help"></textarea>
                    <small id="help" class="hint">Only ASCII characters (code 32–126). Use \n for new lines.</small>

                    <label for="fonts">Choose a font</label>
                    <div class="font-options">
                        <div>
                            <input type="radio" name="fonts" value="standard" id="standard" checked>
                            <label for="standard">Standard</label>
                        </div>
                        <div>
                            <input type="radio" name="fonts" value="thinkertoy" id="thinkertoy">
                            <label for="thinkertoy">Thinkertoy</label>
                        </div>
                        <div>
                            <input type="radio" name="fonts" value="shadow" id="shadow">
                            <label for="shadow">Shadow</label>
                        </div>
                    </div>

                    <div class="actions">
                        <input type="submit" value="Generate" id="submit">
                        <button type="button" id="clear" title="Clear input">Clear</button>
                    </div>
                </form>

            </div>

            {{if .ASCIIArt}}
                <section id="output" aria-live="polite">
                    <h2>Result</h2>
                    <pre>{{.ASCIIArt}}</pre>
                </section>
            {{end}}
        </main>

        <script>
            (function() {
                const text = document.getElementById('text');
                const clearBtn = document.getElementById('clear');

                clearBtn.addEventListener('click', () => {
                    text.value = '';
                    text.focus();
                });

                text.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    }
                });
            })();
        </script>
    </div>
</body>

</html>
